# Render Blueprint - CakeFlow demo (ephemeral SQLite database, no Docker).
#
# Two free web services on Render's native Node runtime:
#   cakeflow-api  Builds the NestJS API and boots it against a SQLite file in
#                 /tmp. The file is lost on every restart/redeploy, so data
#                 resets. See deploy/render/*.sh.
#   cakeflow-web  Next.js storefront + BFF.
#
# After the first deploy, if Render had to suffix either service name, update
# API_INTERNAL_URL, NEXT_PUBLIC_API_URL, NEXT_PUBLIC_APP_URL and WEB_ORIGIN to
# the real URLs.
services:
  - type: web
    name: cakeflow-api
    runtime: node
    plan: free
    region: singapore
    # The build compiles contracts + API. The start command creates the throwaway
    # SQLite file, migrates, seeds and runs the API in the foreground.
    buildCommand: bash deploy/render/build-api.sh
    startCommand: bash deploy/render/start-api.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      # Absolute path so the database lives in ephemeral /tmp, not the checkout.
      - key: DATABASE_URL
        value: file:/tmp/cakeflow/cakeflow.db
      - key: WEB_ORIGIN
        value: https://cakeflow-web.onrender.com
      - key: COOKIE_DOMAIN
        value: cakeflow-web.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: INTERNAL_API_KEY
        generateValue: true
      # Boots with placeholders; replace with Stripe test keys to take payments.
      - key: STRIPE_SECRET_KEY
        value: sk_test_replace_me
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_replace_me
      - key: STRIPE_PLATFORM_FEE_BPS
        value: "0"
      - key: EMAIL_FROM
        value: CakeFlow <bookings@example.com>
      - key: RESEND_API_KEY
        sync: false
      # The seeders refuse to run under NODE_ENV=production without this.
      - key: SEED_ALLOW_PRODUCTION
        value: "1"

  - type: web
    name: cakeflow-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.12.0 --activate &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @cakeflow/contracts build &&
      pnpm --filter @cakeflow/web build
    startCommand: pnpm --filter @cakeflow/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      # Server-to-server calls from the BFF. Public URL works on free instances.
      - key: API_INTERNAL_URL
        value: https://cakeflow-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://cakeflow-api.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://cakeflow-web.onrender.com
      - key: DEFAULT_BAKERY_SLUG
        value: sweetcrumbs
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: cakeflow-api
          envVarKey: INTERNAL_API_KEY
      # Optional: without a publishable key the wizard disables card entry.
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
