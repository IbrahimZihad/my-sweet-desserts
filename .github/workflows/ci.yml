name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @cakeflow/contracts build

      - name: Generate Prisma client
        run: pnpm --filter @cakeflow/api prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build API and web
        run: pnpm build
