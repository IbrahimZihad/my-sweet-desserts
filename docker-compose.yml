name: cakeflow

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cakeflow}
      MYSQL_USER: ${MYSQL_USER:-cakeflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-cakeflow}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-cakeflow}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: ["sh", "./docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      DEFAULT_BAKERY_SLUG: ${DEFAULT_BAKERY_SLUG:-sweetcrumbs}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Optional: forward Stripe test events to the API during local development.
  # Usage: docker compose --profile stripe up stripe
  stripe:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    env_file: .env
    command:
      - listen
      - --forward-to
      - api:4000/v1/payments/webhook
      - --api-key
      - ${STRIPE_SECRET_KEY}
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
